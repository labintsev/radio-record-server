[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-record-server"
version = "0.1.0"
description = "TCP ingest and on-disk segmentation for ESP32 radio streams"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
transcode = ["av>=14"]

[project.scripts]
radio-record = "radio_record.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

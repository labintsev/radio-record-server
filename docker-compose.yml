services:
  radio-record:
    build: .
    image: radio-record:latest
    container_name: radio-record
    restart: unless-stopped
    # Run as the host user so recorded files belong to you (see PUID/PGID in .env).
    user: "${PUID:-1000}:${PGID:-1000}"
    command:
      - --port
      - "9100"
      - --dashboard-port
      - "8080"
      - --dashboard-host
      - "0.0.0.0"
      - --output
      - /data/recordings
    # Only audio is published. The dashboard stays inside the shared network.
    ports:
      - "9100:9100"
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik_frontend}
      # Change the host to the name you actually create a DNS record for.
      traefik.http.routers.radio-record.rule: "Host(`radio-record.mldl.ru`)"
      traefik.http.routers.radio-record.entrypoints: websecure
      traefik.http.routers.radio-record.tls.certresolver: letsencrypt
      traefik.http.routers.radio-record.service: radio-record
      traefik.http.services.radio-record.loadbalancer.server.port: "8080"
      traefik.http.services.radio-record.loadbalancer.healthcheck.path: /healthz
    volumes:
      # Your own directory: no chown needed, the container runs as PUID:PGID.
      - ${HOME}/recordings:/data/recordings
    networks:
      - frontend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Existing Traefik network. Its real name is <compose-project>_frontend, so it
  # comes from TRAEFIK_NETWORK or the default below.
  frontend:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_frontend}
